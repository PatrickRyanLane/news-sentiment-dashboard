<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Chart Debug</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
<h1>Chart Data Debug</h1>
<div id="output"></div>

<script>
async function fetchCsv(url) {
  const r = await fetch(url, {cache:'no-store'});
  if (!r.ok) throw new Error(`HTTP ${r.status} for ${url}`);
  const t = await r.text();
  return await new Promise((res,rej) => Papa.parse(t, {
    header: true,
    skipEmptyLines: true,
    complete: o => res(o.data || []),
    error: e => rej(e)
  }));
}

async function debugData() {
  const output = document.getElementById('output');
  let html = '<pre>';
  
  // Test company to check
  const testCompany = '3M'; // You can change this to any company you want to debug
  
  try {
    // Load article counts
    html += '📊 Loading Article Counts Data...\n';
    const articlesData = await fetchCsv('data/daily_counts/brand-articles-daily-counts-chart.csv');
    html += `Total article rows: ${articlesData.length}\n`;
    
    // Get unique companies and dates
    const articleCompanies = new Set(articlesData.map(r => r.company));
    const articleDates = new Set(articlesData.map(r => r.date));
    html += `Unique companies in articles: ${articleCompanies.size}\n`;
    html += `Unique dates in articles: ${articleDates.size}\n`;
    
    // Check specific company
    const companyArticles = articlesData.filter(r => r.company === testCompany);
    html += `\n🔍 ${testCompany} Article Data:\n`;
    html += `  - Days with data: ${companyArticles.length}\n`;
    if (companyArticles.length > 0) {
      const dates = companyArticles.map(r => r.date).sort();
      html += `  - Date range: ${dates[0]} to ${dates[dates.length-1]}\n`;
      html += `  - All dates: ${dates.join(', ')}\n`;
      
      // Show sample data
      html += `  - Sample data (first 3 entries):\n`;
      companyArticles.slice(0, 3).forEach(row => {
        html += `    ${row.date}: pos=${row.positive}, neu=${row.neutral}, neg=${row.negative}\n`;
      });
    }
    
    html += '\n' + '='.repeat(60) + '\n\n';
    
    // Load SERP counts
    html += '📊 Loading SERP Counts Data...\n';
    const serpsData = await fetchCsv('data/daily_counts/brand-serps-daily-counts-chart.csv');
    html += `Total SERP rows: ${serpsData.length}\n`;
    
    // Get unique companies and dates
    const serpCompanies = new Set(serpsData.map(r => r.company));
    const serpDates = new Set(serpsData.map(r => r.date));
    html += `Unique companies in SERPs: ${serpCompanies.size}\n`;
    html += `Unique dates in SERPs: ${serpDates.size}\n`;
    
    // Check specific company
    const companySERPs = serpsData.filter(r => r.company === testCompany);
    html += `\n🔍 ${testCompany} SERP Data:\n`;
    html += `  - Days with data: ${companySERPs.length}\n`;
    if (companySERPs.length > 0) {
      const dates = companySERPs.map(r => r.date).sort();
      html += `  - Date range: ${dates[0]} to ${dates[dates.length-1]}\n`;
      html += `  - All dates: ${dates.join(', ')}\n`;
      
      // Show sample data
      html += `  - Sample data (first 3 entries):\n`;
      companySERPs.slice(0, 3).forEach(row => {
        html += `    ${row.date}: total=${row.total}, neg=${row.negative_serp || row.neg_serp}, ctrl=${row.controlled || row.control}\n`;
      });
    }
    
    html += '\n' + '='.repeat(60) + '\n\n';
    
    // Check date overlap
    html += '📅 Date Analysis:\n';
    const allDates = new Set([...articleDates, ...serpDates]);
    html += `Total unique dates across both files: ${allDates.size}\n`;
    const sortedDates = [...allDates].sort();
    html += `Date range: ${sortedDates[0]} to ${sortedDates[sortedDates.length-1]}\n`;
    
    // Show last 30 days
    const last30 = sortedDates.slice(-30);
    html += `\nLast 30 days in data: ${last30.join(', ')}\n`;
    
    // Count how many companies have data for each of the last 30 days
    html += '\n📊 Data Coverage for Last 30 Days:\n';
    last30.forEach(date => {
      const artCount = articlesData.filter(r => r.date === date).length;
      const serpCount = serpsData.filter(r => r.date === date).length;
      html += `  ${date}: ${artCount} companies (articles), ${serpCount} companies (SERPs)\n`;
    });
    
    // List companies with most complete data
    html += '\n🏆 Companies with Most Complete Data:\n';
    const companyCoverage = {};
    articleCompanies.forEach(company => {
      const artDays = articlesData.filter(r => r.company === company).length;
      const serpDays = serpsData.filter(r => r.company === company).length;
      companyCoverage[company] = { articles: artDays, serps: serpDays, total: artDays + serpDays };
    });
    
    const topCompanies = Object.entries(companyCoverage)
      .sort((a, b) => b[1].total - a[1].total)
      .slice(0, 10);
    
    topCompanies.forEach(([company, coverage]) => {
      html += `  ${company}: ${coverage.articles} days (articles), ${coverage.serps} days (SERPs)\n`;
    });
    
    // Suggest a company with good coverage
    const wellCoveredCompany = topCompanies.find(([company, coverage]) => 
      coverage.articles >= 20 && coverage.serps >= 20
    );
    
    if (wellCoveredCompany) {
      html += `\n✅ Suggestion: Try selecting "${wellCoveredCompany[0]}" for testing - it has good data coverage.\n`;
    }
    
  } catch (error) {
    html += `\n❌ Error: ${error.message}\n`;
  }
  
  html += '</pre>';
  output.innerHTML = html;
}

// Run debug
debugData();
</script>
</body>
</html>
