name: Aggregate Negative Articles

on:
  schedule:
    # Run daily at 12:30 UTC (after article processing completes at 12:00 UTC)
    - cron: '30 12 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  aggregate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Get full history for accurate date processing
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas
      
      - name: Run negative articles aggregation
        run: |
          echo "🔄 Starting negative articles aggregation..."
          python scripts/aggregate_negative_articles.py --days-back 90
      
      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain data/negative-articles-summary.csv) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected in negative-articles-summary.csv"
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No changes to commit"
          fi
      
      - name: Commit and push if changed
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Add the summary file
          git add data/negative-articles-summary.csv
          
          # Get stats for commit message
          ROWS=$(wc -l < data/negative-articles-summary.csv)
          SIZE=$(du -h data/negative-articles-summary.csv | cut -f1)
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          
          # Commit with informative message
          git commit -m "Update negative articles summary
          
          📊 Rows: $ROWS
          💾 Size: $SIZE
          🕒 Generated: $DATE
          
          Automated update via GitHub Actions"
          
          # Push changes
          git push
          
          echo "✅ Successfully committed and pushed changes"
      
      - name: Summary
        if: always()
        run: |
          echo "### Negative Articles Aggregation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ -f data/negative-articles-summary.csv ]]; then
            ROWS=$(wc -l < data/negative-articles-summary.csv)
            SIZE=$(du -h data/negative-articles-summary.csv | cut -f1)
            echo "✅ **File created successfully**" >> $GITHUB_STEP_SUMMARY
            echo "- 📊 Total rows: $ROWS" >> $GITHUB_STEP_SUMMARY
            echo "- 💾 File size: $SIZE" >> $GITHUB_STEP_SUMMARY
            echo "- 📁 Location: \`data/negative-articles-summary.csv\`" >> $GITHUB_STEP_SUMMARY
            
            if [[ "${{ steps.check_changes.outputs.changes }}" == "true" ]]; then
              echo "- ✅ Changes committed and pushed" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ℹ️  No changes from previous run" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ **File generation failed**" >> $GITHUB_STEP_SUMMARY
          fi
