name: Daily Stock Data Pipeline

on:
  # Manual run with optional date
  workflow_dispatch:
    inputs:
      date:
        description: "Run date in UTC (YYYY-MM-DD). Leave blank for today."
        required: false
        type: string
  # Scheduled run after market close (5 PM ET = 21:00 UTC)
  schedule:
    - cron: "0 21 * * 1-5"   # Weekdays only, 5 PM ET

# allow the workflow to push commits back to the repo
permissions:
  contents: write

# prevent two data-writing jobs from colliding
concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed so we can pull/rebase before pushing

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure folders
        run: |
          mkdir -p data/stock_prices
          mkdir -p rosters

      - name: Fetch stock data
        env:
          RUN_DATE: ${{ github.event.inputs.date || '' }}
        run: |
          set -euo pipefail
          DATE_TO_RUN="${RUN_DATE:-$(date -u +%F)}"
          echo "Fetching stock data for ${DATE_TO_RUN}"
          python scripts/fetch_stock_data.py

      # --- Safe commit & push: rebase onto latest main, retry once if needed ---
      - name: Commit outputs
        shell: bash
        env:
          RUN_DATE: ${{ github.event.inputs.date || '' }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # Rebase onto latest main even with local changes from earlier steps
          git fetch origin main
          git checkout main
          git pull --rebase --autostash origin main

          # Stage & commit any generated/updated files
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          DATE_TO_USE="${RUN_DATE:-$(date -u +%F)}"
          git commit -m "stock pipeline: update data (${DATE_TO_USE})"

          # Push; if remote moved meanwhile, rebase once and retry
          if ! git push origin HEAD:main; then
            echo "Push rejected; rebasing once…"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
