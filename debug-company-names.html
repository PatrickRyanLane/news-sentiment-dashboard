<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Company Name Matching Debug</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  body { font-family: monospace; padding: 20px; }
  .match { background: #90EE90; }
  .no-match { background: #FFB6C1; }
  pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
  .warning { color: red; font-weight: bold; }
</style>
</head>
<body>
<h1>Company Name Matching Debug</h1>
<div id="output"></div>

<script>
async function fetchCsv(url) {
  const r = await fetch(url, {cache:'no-store'});
  if (!r.ok) throw new Error(`HTTP ${r.status} for ${url}`);
  const t = await r.text();
  return await new Promise((res,rej) => Papa.parse(t, {
    header: true,
    skipEmptyLines: true,
    complete: o => res(o.data || []),
    error: e => rej(e)
  }));
}

async function debugCompanyNames() {
  const output = document.getElementById('output');
  let html = '<pre>';
  
  try {
    html += '🔍 DEBUGGING COMPANY NAME MATCHING\n';
    html += '=' .repeat(60) + '\n\n';
    
    // Load all data sources
    const articlesData = await fetchCsv('data/daily_counts/brand-articles-daily-counts-chart.csv');
    const serpsData = await fetchCsv('data/daily_counts/brand-serps-daily-counts-chart.csv');
    
    // Also try to load a recent daily table file to see how companies are stored there
    const today = new Date().toISOString().split('T')[0];
    let tableData = [];
    try {
      tableData = await fetchCsv(`data/processed_articles/${today}-brand-articles-table.csv`);
      html += `✅ Loaded today's table data (${today})\n`;
    } catch {
      // Try yesterday
      const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
      try {
        tableData = await fetchCsv(`data/processed_articles/${yesterday}-brand-articles-table.csv`);
        html += `✅ Loaded yesterday's table data (${yesterday})\n`;
      } catch {
        html += `⚠️  Could not load recent table data\n`;
      }
    }
    
    html += '\n';
    
    // Get all unique company names from each source
    const articleCompanies = new Set(articlesData.map(r => r.company));
    const serpCompanies = new Set(serpsData.map(r => r.company));
    const tableCompanies = new Set(tableData.map(r => r.company));
    
    html += `📊 Unique company names per source:\n`;
    html += `  - Articles CSV: ${articleCompanies.size} companies\n`;
    html += `  - SERPs CSV: ${serpCompanies.size} companies\n`;
    html += `  - Table CSV: ${tableCompanies.size} companies\n\n`;
    
    // Look for "3M" specifically in different variations
    html += '🔍 SEARCHING FOR "3M" VARIATIONS:\n';
    html += '-'.repeat(40) + '\n';
    
    const searchTerms = ['3M', '3m', '3M Company', '3M Co', '3M Co.', '3M Corporation'];
    
    searchTerms.forEach(term => {
      html += `\nSearching for "${term}":\n`;
      
      // Check articles
      const articleMatches = [...articleCompanies].filter(c => c === term);
      const articleContains = [...articleCompanies].filter(c => c.toLowerCase().includes('3m'));
      html += `  Articles: ${articleMatches.length > 0 ? '✅ EXACT MATCH' : '❌ No exact match'}\n`;
      if (articleContains.length > 0 && articleMatches.length === 0) {
        html += `    Contains "3m": ${articleContains.join(', ')}\n`;
      }
      
      // Check SERPs
      const serpMatches = [...serpCompanies].filter(c => c === term);
      const serpContains = [...serpCompanies].filter(c => c.toLowerCase().includes('3m'));
      html += `  SERPs: ${serpMatches.length > 0 ? '✅ EXACT MATCH' : '❌ No exact match'}\n`;
      if (serpContains.length > 0 && serpMatches.length === 0) {
        html += `    Contains "3m": ${serpContains.join(', ')}\n`;
      }
      
      // Check table
      const tableMatches = [...tableCompanies].filter(c => c === term);
      const tableContains = [...tableCompanies].filter(c => c.toLowerCase().includes('3m'));
      html += `  Table: ${tableMatches.length > 0 ? '✅ EXACT MATCH' : '❌ No exact match'}\n`;
      if (tableContains.length > 0 && tableMatches.length === 0) {
        html += `    Contains "3m": ${tableContains.join(', ')}\n`;
      }
    });
    
    html += '\n' + '='.repeat(60) + '\n\n';
    
    // Find ALL variations containing "3M" or "3m"
    html += '📋 ALL COMPANY NAMES CONTAINING "3M" (case-insensitive):\n';
    html += '-'.repeat(40) + '\n';
    
    const all3MVariations = new Set();
    [...articleCompanies, ...serpCompanies, ...tableCompanies].forEach(c => {
      if (c && c.toLowerCase().includes('3m')) {
        all3MVariations.add(c);
      }
    });
    
    if (all3MVariations.size > 0) {
      [...all3MVariations].sort().forEach(name => {
        html += `  "${name}"\n`;
        
        // Show which sources have this exact name
        const inArticles = articleCompanies.has(name);
        const inSerps = serpCompanies.has(name);
        const inTable = tableCompanies.has(name);
        
        html += `    Found in: `;
        const sources = [];
        if (inArticles) sources.push('Articles');
        if (inSerps) sources.push('SERPs');
        if (inTable) sources.push('Table');
        html += sources.join(', ') + '\n';
        
        // Count data points for this exact name
        const articleCount = articlesData.filter(r => r.company === name).length;
        const serpCount = serpsData.filter(r => r.company === name).length;
        html += `    Data points: ${articleCount} article days, ${serpCount} SERP days\n\n`;
      });
    } else {
      html += '  None found!\n';
    }
    
    html += '\n' + '='.repeat(60) + '\n\n';
    
    // Check for potential mismatches
    html += '⚠️  POTENTIAL ISSUES:\n';
    html += '-'.repeat(40) + '\n';
    
    // Check for companies that exist in one dataset but not another
    const onlyInArticles = [...articleCompanies].filter(c => !serpCompanies.has(c));
    const onlyInSerps = [...serpCompanies].filter(c => !articleCompanies.has(c));
    
    // Focus on 3M-related ones
    const problematic3M = [];
    onlyInArticles.forEach(c => {
      if (c.toLowerCase().includes('3m')) {
        problematic3M.push({ name: c, source: 'Only in Articles' });
      }
    });
    onlyInSerps.forEach(c => {
      if (c.toLowerCase().includes('3m')) {
        problematic3M.push({ name: c, source: 'Only in SERPs' });
      }
    });
    
    if (problematic3M.length > 0) {
      html += '\n<span class="warning">⚠️  3M-related companies with mismatched names:</span>\n';
      problematic3M.forEach(p => {
        html += `  "${p.name}" - ${p.source}\n`;
      });
    }
    
    // Sample some actual data rows for 3M
    html += '\n' + '='.repeat(60) + '\n\n';
    html += '📊 SAMPLE DATA ROWS FOR 3M VARIATIONS:\n';
    html += '-'.repeat(40) + '\n';
    
    all3MVariations.forEach(name => {
      html += `\n"${name}" sample data:\n`;
      
      // Get first 3 article rows
      const articleSamples = articlesData.filter(r => r.company === name).slice(0, 3);
      if (articleSamples.length > 0) {
        html += '  Articles:\n';
        articleSamples.forEach(row => {
          html += `    ${row.date}: pos=${row.positive}, neu=${row.neutral}, neg=${row.negative}\n`;
        });
      }
      
      // Get first 3 SERP rows
      const serpSamples = serpsData.filter(r => r.company === name).slice(0, 3);
      if (serpSamples.length > 0) {
        html += '  SERPs:\n';
        serpSamples.forEach(row => {
          html += `    ${row.date}: total=${row.total}, neg=${row.negative_serp || row.neg_serp}, ctrl=${row.controlled || row.control}\n`;
        });
      }
    });
    
    // Check how the company name appears when you select it
    html += '\n' + '='.repeat(60) + '\n\n';
    html += '💡 RECOMMENDATIONS:\n';
    html += '-'.repeat(40) + '\n';
    
    if (all3MVariations.size > 1) {
      html += '⚠️  <span class="warning">Multiple variations of 3M found!</span>\n';
      html += '  This is causing the matching problem.\n\n';
      html += '  The exact strings are:\n';
      [...all3MVariations].forEach(name => {
        html += `    "${name}" (length: ${name.length} chars)\n`;
      });
      html += '\n  When you select 3M from the dropdown, it needs to match EXACTLY.\n';
      html += '  Check for trailing spaces, different cases, or suffixes.\n';
    } else if (all3MVariations.size === 1) {
      const exactName = [...all3MVariations][0];
      html += `✅ Only one variation found: "${exactName}"\n`;
      html += `  Make sure the selection uses exactly: "${exactName}"\n`;
    }
    
  } catch (error) {
    html += `\n❌ Error: ${error.message}\n`;
  }
  
  html += '</pre>';
  output.innerHTML = html;
}

// Run debug
debugCompanyNames();
</script>
</body>
</html>
