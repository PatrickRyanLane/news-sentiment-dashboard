<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CSV Parsing Debug</title>
<style>
  body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #e0e0e0; }
  .error { background: #5a2d2d; padding: 8px; margin: 4px 0; }
  .warning { background: #5a5a2d; padding: 8px; margin: 4px 0; }
  .good { background: #2d5a2d; padding: 8px; margin: 4px 0; }
  h2 { color: #58dbed; margin-top: 20px; }
  pre { background: #2a2a2a; padding: 12px; border-radius: 4px; overflow-x: auto; }
  .raw-line { color: #888; font-size: 0.9em; }
  .parsed { color: #82c618; }
  .highlight { background: #5a5a2d; color: #ffff00; font-weight: bold; }
</style>
</head>
<body>
<h1>CSV Parsing Debug - Check for PR13 Issues</h1>
<p>Checking if pipe-separated URL support broke company name parsing...</p>
<div id="output">Loading...</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
async function debugCSVParsing() {
  const output = document.getElementById('output');
  let html = '';
  
  try {
    // First, let's look at the raw CSV to see the structure
    html += '<h2>1. Fetching Raw CSV Data</h2><pre>';
    
    // Get raw text of articles CSV
    const articlesResponse = await fetch('data/daily_counts/brand-articles-daily-counts-chart.csv', {cache:'no-store'});
    const articlesRaw = await articlesResponse.text();
    
    // Get raw text of SERPs CSV  
    const serpsResponse = await fetch('data/daily_counts/brand-serps-daily-counts-chart.csv', {cache:'no-store'});
    const serpsRaw = await serpsResponse.text();
    
    // Show first 10 lines of each to see structure
    html += '<strong>Articles CSV - First 10 lines (RAW):</strong>\n';
    const articleLines = articlesRaw.split('\n').slice(0, 10);
    articleLines.forEach((line, i) => {
      html += `<span class="raw-line">Line ${i}: ${line.substring(0, 200)}${line.length > 200 ? '...' : ''}</span>\n`;
    });
    
    html += '\n<strong>SERPs CSV - First 10 lines (RAW):</strong>\n';
    const serpLines = serpsRaw.split('\n').slice(0, 10);
    serpLines.forEach((line, i) => {
      html += `<span class="raw-line">Line ${i}: ${line.substring(0, 200)}${line.length > 200 ? '...' : ''}</span>\n`;
    });
    
    html += '</pre>';
    
    // Check for 3M specifically in raw text
    html += '<h2>2. Searching for "3M" in Raw CSV Text</h2><pre>';
    
    // Find all lines containing "3M" (case insensitive)
    const lines3M_articles = articlesRaw.split('\n').filter(line => line.toLowerCase().includes('3m'));
    const lines3M_serps = serpsRaw.split('\n').filter(line => line.toLowerCase().includes('3m'));
    
    html += `<strong>Found ${lines3M_articles.length} lines with "3M" in Articles CSV</strong>\n`;
    if (lines3M_articles.length > 0 && lines3M_articles.length <= 10) {
      lines3M_articles.forEach(line => {
        // Highlight the 3M part
        const highlighted = line.replace(/3m/gi, '<span class="highlight">$&</span>');
        html += `  ${highlighted}\n`;
      });
    } else if (lines3M_articles.length > 10) {
      html += `  (Showing first 5 and last 5 of ${lines3M_articles.length} lines)\n`;
      lines3M_articles.slice(0, 5).forEach(line => {
        const highlighted = line.replace(/3m/gi, '<span class="highlight">$&</span>');
        html += `  ${highlighted}\n`;
      });
      html += '  ...\n';
      lines3M_articles.slice(-5).forEach(line => {
        const highlighted = line.replace(/3m/gi, '<span class="highlight">$&</span>');
        html += `  ${highlighted}\n`;
      });
    }
    
    html += `\n<strong>Found ${lines3M_serps.length} lines with "3M" in SERPs CSV</strong>\n`;
    if (lines3M_serps.length > 0 && lines3M_serps.length <= 10) {
      lines3M_serps.forEach(line => {
        const highlighted = line.replace(/3m/gi, '<span class="highlight">$&</span>');
        html += `  ${highlighted}\n`;
      });
    } else if (lines3M_serps.length > 10) {
      html += `  (Showing first 5 and last 5 of ${lines3M_serps.length} lines)\n`;
      lines3M_serps.slice(0, 5).forEach(line => {
        const highlighted = line.replace(/3m/gi, '<span class="highlight">$&</span>');
        html += `  ${highlighted}\n`;
      });
      html += '  ...\n';
      lines3M_serps.slice(-5).forEach(line => {
        const highlighted = line.replace(/3m/gi, '<span class="highlight">$&</span>');
        html += `  ${highlighted}\n`;
      });
    }
    
    html += '</pre>';
    
    // Parse with PapaParse and check for issues
    html += '<h2>3. Parsing with PapaParse</h2><pre>';
    
    const articlesParsed = Papa.parse(articlesRaw, {
      header: true,
      skipEmptyLines: true
    });
    
    const serpsParsed = Papa.parse(serpsRaw, {
      header: true,
      skipEmptyLines: true
    });
    
    html += `Articles: ${articlesParsed.data.length} rows parsed\n`;
    html += `SERPs: ${serpsParsed.data.length} rows parsed\n`;
    
    if (articlesParsed.errors.length > 0) {
      html += `<span class="error">⚠️ Articles parsing errors: ${articlesParsed.errors.length}</span>\n`;
      articlesParsed.errors.slice(0, 5).forEach(err => {
        html += `  ${JSON.stringify(err)}\n`;
      });
    }
    
    if (serpsParsed.errors.length > 0) {
      html += `<span class="error">⚠️ SERPs parsing errors: ${serpsParsed.errors.length}</span>\n`;
      serpsParsed.errors.slice(0, 5).forEach(err => {
        html += `  ${JSON.stringify(err)}\n`;
      });
    }
    
    html += '</pre>';
    
    // Check parsed data for 3M
    html += '<h2>4. Checking Parsed Data for "3M" Variations</h2><pre>';
    
    const articles3M = articlesParsed.data.filter(row => 
      row.company && row.company.toLowerCase().includes('3m')
    );
    
    const serps3M = serpsParsed.data.filter(row => 
      row.company && row.company.toLowerCase().includes('3m')
    );
    
    // Get unique company values
    const unique3M_articles = [...new Set(articles3M.map(r => r.company))];
    const unique3M_serps = [...new Set(serps3M.map(r => r.company))];
    
    html += '<strong>Unique "3M" company values in Articles:</strong>\n';
    unique3M_articles.forEach(company => {
      const count = articles3M.filter(r => r.company === company).length;
      html += `  "<span class="parsed">${company}</span>" - ${count} rows\n`;
    });
    
    html += '\n<strong>Unique "3M" company values in SERPs:</strong>\n';
    unique3M_serps.forEach(company => {
      const count = serps3M.filter(r => r.company === company).length;
      html += `  "<span class="parsed">${company}</span>" - ${count} rows\n`;
    });
    
    html += '</pre>';
    
    // Check if there are pipes in company names
    html += '<h2>5. Checking for Pipe Characters in Company Names</h2><pre>';
    
    const companiesWithPipes = articlesParsed.data.filter(row => 
      row.company && row.company.includes('|')
    );
    
    if (companiesWithPipes.length > 0) {
      html += `<span class="error">⚠️ Found ${companiesWithPipes.length} rows with pipes in company names!</span>\n`;
      html += 'This could be the PR13 issue!\n';
      companiesWithPipes.slice(0, 5).forEach(row => {
        html += `  Date: ${row.date}, Company: "${row.company}"\n`;
      });
    } else {
      html += '<span class="good">✅ No pipes found in company names</span>\n';
    }
    
    html += '</pre>';
    
    // Check column structure
    html += '<h2>6. Column Structure Analysis</h2><pre>';
    
    if (articlesParsed.data.length > 0) {
      const firstRow = articlesParsed.data[0];
      const columns = Object.keys(firstRow);
      
      html += '<strong>Articles CSV columns:</strong>\n';
      columns.forEach((col, i) => {
        const sampleValue = firstRow[col];
        html += `  Column ${i}: "${col}" = "${sampleValue}"\n`;
      });
      
      // Check if controlled column has pipes
      const rowsWithPipeInControlled = articlesParsed.data.filter(row => {
        return columns.some(col => 
          col.toLowerCase().includes('control') && 
          row[col] && 
          String(row[col]).includes('|')
        );
      });
      
      if (rowsWithPipeInControlled.length > 0) {
        html += `\n<span class="warning">Found ${rowsWithPipeInControlled.length} rows with pipes in controlled column</span>\n`;
      }
    }
    
    if (serpsParsed.data.length > 0) {
      const firstRow = serpsParsed.data[0];
      const columns = Object.keys(firstRow);
      
      html += '\n<strong>SERPs CSV columns:</strong>\n';
      columns.forEach((col, i) => {
        const sampleValue = firstRow[col];
        html += `  Column ${i}: "${col}" = "${sampleValue}"\n`;
      });
    }
    
    html += '</pre>';
    
    // Manual parsing check
    html += '<h2>7. Manual CSV Parsing (without library)</h2><pre>';
    
    // Try parsing a 3M line manually
    if (lines3M_articles.length > 0) {
      const testLine = lines3M_articles[0];
      html += `Testing manual parse of: ${testLine}\n`;
      
      const values = testLine.split(',');
      html += 'Split by comma:\n';
      values.forEach((val, i) => {
        html += `  [${i}]: "${val}"\n`;
      });
      
      // Check if any value contains a pipe
      const pipeValues = values.filter(v => v.includes('|'));
      if (pipeValues.length > 0) {
        html += `<span class="warning">⚠️ Found ${pipeValues.length} values with pipes</span>\n`;
        pipeValues.forEach(v => {
          html += `  "${v}"\n`;
        });
      }
    }
    
    html += '</pre>';
    
    // Summary
    html += '<h2>Summary</h2><pre>';
    
    if (unique3M_articles.length > 1 || unique3M_serps.length > 1) {
      html += '<span class="error">❌ PROBLEM CONFIRMED: Multiple "3M" variations found</span>\n';
      html += 'This is causing the matching issue.\n\n';
      
      if (companiesWithPipes.length > 0) {
        html += '<span class="error">⚠️ LIKELY CAUSE: PR13 pipe-separation is affecting company names</span>\n';
      } else {
        html += '<span class="warning">⚠️ The variations exist but pipes are not in company names</span>\n';
        html += 'The issue might be in the data collection/processing scripts\n';
      }
    } else {
      html += '<span class="good">✅ No obvious parsing issues found</span>\n';
    }
    
    html += '</pre>';
    
  } catch (error) {
    html += `<pre class="error">Error: ${error.message}\n${error.stack}</pre>`;
  }
  
  output.innerHTML = html;
}

// Run debug
debugCSVParsing();
</script>
</body>
</html>
